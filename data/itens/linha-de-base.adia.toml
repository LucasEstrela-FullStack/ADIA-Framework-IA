[item.dicas]
L1 = """
A incógnita está sendo somada a algo ou multiplicada por algo? A resposta muda o primeiro passo.\
"""
L2 = """
Aqui a incógnita está apenas multiplicada por um coeficiente: não há termo constante a tratar.\
"""
L3 = """
Divida os dois membros pelo coeficiente que multiplica a incógnita.\
"""
L4 = """
Exemplo resolvido com outros números. Em 4t = 32, divida os dois lados por 4: t = 8. Conferindo, 4 vezes 8 resulta 32.\
"""

