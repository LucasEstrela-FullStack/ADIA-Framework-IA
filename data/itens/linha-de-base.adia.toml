[item.dicas]
L1 = """
Quantos passos você acha que esta equação exige? Diga o número antes de resolver e confira depois.\
"""
L2 = """
Duas operações separam a incógnita do resultado: uma multiplicação e uma adição. Elas se desfazem na ordem contrária à que foram aplicadas.\
"""
L3 = """
Desfaça primeiro a adição nos dois membros e depois a multiplicação, dividindo os dois membros pelo coeficiente.\
"""
L4 = """
Exemplo resolvido com outros números. Em 3y + 2 = 17, subtraia 2 dos dois lados: 3y = 15. Divida os dois lados por 3: y = 5. Verificando, 3 vezes 5, mais 2, dá 17.\
"""
