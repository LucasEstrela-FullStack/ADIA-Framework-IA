[[item]]
id = "alg-eq-401"
enunciado = """
Resolva a equação x + 9 = 15 e informe o valor de x.\
"""
habilidade_alvo = "equacao_linear"
dificuldade = 1
tamanho_max_resposta = 120
tipo_gabarito = "numerico"
gabarito = "6"
tolerancia = "0.05"
variacoes_gabarito = ["6", "seis"]
incognita = "x"
etapas_permitidas = ["linha_de_base"]
transferencia = false

[item.dicas]
L1 = """
O que você precisa somar ou retirar para que a incógnita fique sozinha? Pense na pergunta, não na conta.\
"""
L2 = """
Esta é a forma mais simples de equação do primeiro grau: a incógnita aparece somada a um termo constante.\
"""
L3 = """
Aplique aos dois membros a operação inversa da adição que acompanha a incógnita.\
"""
L4 = """
Exemplo resolvido com outros números. Em y + 4 = 11, subtraia 4 dos dois lados: y = 7. Conferindo, 7 mais 4 resulta 11.\
"""

[[item]]
id = "alg-eq-402"
