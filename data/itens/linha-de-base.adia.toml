tamanho_max_resposta = 120
tipo_gabarito = "numerico"
gabarito = "12"
tolerancia = "0.05"
variacoes_gabarito = ["12", "doze"]
incognita = "y"
etapas_permitidas = ["linha_de_base"]
transferencia = false

[item.dicas]
L1 = """
Qual operação foi aplicada à incógnita nesta equação? E qual é a operação que a desfaz?\
"""
L2 = """
Subtrair um valor da incógnita e somar o mesmo valor são operações inversas, e é essa inversão que a resolução usa.\
"""
L3 = """
Some aos dois membros o valor que está sendo subtraído da incógnita.\
"""
L4 = """
Exemplo resolvido com outros números. Em m - 3 = 4, some 3 aos dois lados: m = 7. Verificando, 7 menos 3 resulta 4.\
"""

