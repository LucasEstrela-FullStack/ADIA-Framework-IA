[item.dicas]
L1 = """
Em que ordem as operações foram aplicadas à incógnita nesta equação? Responder isso indica por onde começar a desfazê-las.\
"""
L2 = """
O termo constante aparece subtraído do produto entre o coeficiente e a incógnita. São duas operações encadeadas, e cada uma tem a sua inversa.\
"""
L3 = """
Some aos dois membros o valor que cancela a constante do lado da incógnita e, em seguida, divida ambos os membros pelo coeficiente.\
"""
L4 = """
Um caso análogo resolvido com outros números. Em 4m - 3 = 17, some 3 aos dois lados: 4m = 20. Divida os dois lados por 4: m = 5. Verificando, 4 vezes 5, menos 3, dá 17.\
"""

