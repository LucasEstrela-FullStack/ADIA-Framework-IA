[item.dicas]
L1 = """
O que você precisa descobrir aqui, e o que já está dado? Separe uma coisa da outra antes de calcular.\
"""
L2 = """
É uma equação do primeiro grau com uma incógnita: há um coeficiente multiplicando a incógnita e um termo constante somado ao produto.\
"""
L3 = """
Desfaça primeiro a adição, aplicando a operação inversa aos dois membros, e depois a multiplicação, dividindo os dois membros pelo coeficiente.\
"""
L4 = """
Exemplo resolvido com outros números. Em 2y + 7 = 25, subtraia 7 dos dois lados: 2y = 18. Divida os dois lados por 2: y = 9. Conferindo, 2 vezes 9, mais 7, resulta 25.\
"""

