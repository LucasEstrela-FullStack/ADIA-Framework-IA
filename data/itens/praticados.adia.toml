[item.dicas]
L1 = """
Antes de calcular qualquer coisa: o que precisa continuar valendo nos dois lados de uma igualdade para que ela siga verdadeira depois de você mexer nela?\
"""
L2 = """
Esta é uma equação do primeiro grau com uma incógnita. A igualdade funciona como uma balança em equilíbrio: os dois membros valem o mesmo, e é esse equilíbrio que a resolução preserva.\
"""
L3 = """
Trabalhe em duas etapas. Primeiro desfaça a soma que acompanha a incógnita, aplicando a operação inversa aos dois membros; só depois desfaça a multiplicação, dividindo os dois membros pelo coeficiente da incógnita.\
"""
L4 = """
Veja um exemplo resolvido com outros números. Em 5y + 2 = 17, subtraia 2 dos dois lados: 5y = 15. Agora divida os dois lados por 5: y = 3. Confira substituindo: 5 vezes 3, mais 2, resulta 17, e a igualdade se mantém.\
"""

