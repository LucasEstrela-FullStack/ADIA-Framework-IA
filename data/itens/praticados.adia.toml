O que muda, no seu jeito de resolver, quando a incógnita aparece nos dois lados da igualdade? Pense antes de escrever.\
"""
L2 = """
O conceito em jogo é o de termos semelhantes: termos com a mesma incógnita podem ser reunidos, e os termos constantes também. Reunir não altera a igualdade, apenas a reescreve.\
"""
L3 = """
Leve todos os termos com a incógnita para um mesmo membro e todos os termos constantes para o outro, aplicando a mesma operação aos dois lados em cada passo. Só então divida pelo coeficiente que restar.\
