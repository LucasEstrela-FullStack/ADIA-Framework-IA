Exemplo resolvido com outros números. Em 6m + 2 = 3m + 20, subtraia 3m dos dois lados: 3m + 2 = 20. Subtraia 2 dos dois lados: 3m = 18. Divida os dois lados por 3: m = 6.\
"""

