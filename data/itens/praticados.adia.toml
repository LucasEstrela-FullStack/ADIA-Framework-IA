O que os parênteses estão dizendo sobre a ordem em que as operações foram feitas? Responda isso antes de escolher o primeiro passo.\
"""
L2 = """
O que está em jogo é a propriedade distributiva da multiplicação em relação à adição: um fator que multiplica uma soma multiplica cada parcela dela.\
"""
L3 = """
Você tem dois caminhos equivalentes: distribuir o fator sobre a soma dentro dos parênteses, ou dividir os dois membros por esse fator e resolver a equação mais simples que sobra. Escolha um e siga até o fim.\
"""
