Exemplo resolvido com outros números. Em 2(y + 3) = 14, divida os dois lados por 2: y + 3 = 7. Subtraia 3 dos dois lados: y = 4. Conferindo, 2 vezes a soma de 4 com 3 dá 14.\
"""

