[[item]]
id = "alg-eq-501"
enunciado = """
Resolva a equação 9x - 4 = 23 e informe o valor de x.\
"""
habilidade_alvo = "equacao_linear"
dificuldade = 2
tamanho_max_resposta = 120
tipo_gabarito = "numerico"
gabarito = "3"
tolerancia = "0.05"
variacoes_gabarito = ["3", "três"]
incognita = "x"
etapas_permitidas = ["teste_retencao"]
transferencia = false

[item.dicas]
L1 = """
Faz algum tempo que você resolveu equações como esta. O que você lembra do procedimento?\
"""
L2 = """
A estrutura é a de sempre: um coeficiente multiplicando a incógnita e um termo constante subtraído do produto.\
"""
L3 = """
Some aos dois membros o valor subtraído e depois divida os dois membros pelo coeficiente.\
"""
L4 = """
Exemplo resolvido com outros números. Em 5y - 2 = 18, some 2 aos dois lados: 5y = 20. Divida os dois lados por 5: y = 4. Conferindo, 5 vezes 4, menos 2, dá 18.\
"""

