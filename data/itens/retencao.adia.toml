[item.dicas]
L1 = """
A incógnita aparece dos dois lados. Que transformação deixaria esta equação parecida com as mais simples que você já resolveu?\
"""
L2 = """
Reunir termos semelhantes produz uma equação equivalente, com a mesma solução e menos termos.\
"""
L3 = """
Subtraia dos dois membros o termo com a incógnita de menor coeficiente, trate a constante em seguida e divida pelo coeficiente no último passo.\
"""
L4 = """
Exemplo resolvido com outros números. Em 7m + 2 = 4m + 17, subtraia 4m dos dois lados: 3m + 2 = 17. Subtraia 2 dos dois lados: 3m = 15. Divida os dois lados por 3: m = 5.\
"""

