[item.dicas]
L1 = """
Que parte do gasto aconteceu uma única vez, e que parte depende da quantidade que você precisa descobrir?\
"""
L2 = """
O item comprado uma única vez entra como termo constante; o item repetido entra como produto do preço pela quantidade desconhecida.\
"""
L3 = """
Chame a quantidade procurada por uma letra, iguale o gasto total à soma da parte fixa com o produto do preço unitário por essa letra, e resolva.\
"""
L4 = """
Uma situação análoga com outros números. Um livro custa 20 reais e cada lápis custa 2 reais, e o gasto total foi 32 reais. Chamando de n os lápis, temos 20 + 2n = 32. Subtraia 20 dos dois lados: 2n = 12. Divida os dois lados por 2: n = 6 lápis.\
"""
