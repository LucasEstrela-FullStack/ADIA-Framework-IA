[item.dicas]
L1 = """
Há parênteses e há incógnita nos dois lados. Qual dessas duas coisas você trataria primeiro, e por quê?\
"""
L2 = """
A distributiva abre os parênteses preservando o sinal de cada parcela; depois dela, a equação volta a ser do tipo com incógnita nos dois membros.\
"""
L3 = """
Distribua o fator, reúna os termos com a incógnita num membro e as constantes no outro, e divida pelo coeficiente que restar.\
"""
L4 = """
Exemplo resolvido com outros números. Em 3(t - 2) = t + 10, distribua à esquerda: 3t - 6 = t + 10. Subtraia t dos dois lados: 2t - 6 = 10. Some 6 aos dois lados: 2t = 16. Divida os dois lados por 2: t = 8.\
"""

